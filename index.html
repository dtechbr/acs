<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USF - Gestão de Território</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <input type="color" id="seletor-cor-card" style="display:none;" onchange="aplicarNovaCor(this.value)">
  <div id="tela-login" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f8f9fa;z-index:9999;display:flex;align-items:center;justify-content:center;">
    <div class="card shadow-lg" style="width:320px;padding:20px;">
      <div class="text-center mb-4">
        <i class="fas fa-user-shield fa-3x text-primary"></i>
        <h4 class="mt-2">Acesso Restrito</h4>
        <p class="text-muted small">USF Vila Dutra - Microárea</p>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Usuário</label>
        <input type="text" id="login-user" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Senha</label>
        <input type="password" id="login-pass" class="form-control">
      </div>
      <button class="btn btn-primary w-100" onclick="autenticar()">Entrar</button>
      <div id="login-erro" class="text-danger small mt-2 text-center" style="display:none;">Usuário ou senha incorretos!</div>
    </div>
  </div>
  <nav class="navbar navbar-dark bg-primary shadow-sm mb-3 sticky-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1" style="font-size:1.1rem;"><i class="fas fa-map-marked-alt"></i> USF Vila Dutra</span>
      <div id="user-info-area" class="align-items-center text-white" style="display:none;">
        <i class="fas fa-user-circle me-1"></i>
        <span id="user-logged-name" class="small me-2 fw-bold"></span>
        <button class="btn btn-sm btn-light text-primary py-0 fw-bold" onclick="logout()" style="font-size:0.75rem;">
          <i class="fas fa-sign-out-alt"></i> SAIR
        </button>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="filter-bar">
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <input id="input-busca" type="text" class="form-control form-control-sm" placeholder="Buscar por nome ou endereço" oninput="aplicarFiltrosDebounced()">
        </div>
        <div class="col-6 col-md-3">
          <select id="select-ordem" class="form-select form-select-sm" onchange="aplicarFiltros()">
            <option value="familia">Ordenar por Família</option>
            <option value="nome">Ordenar por Nome</option>
            <option value="endereco">Ordenar por Endereço</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <select id="select-filtro" class="form-select form-select-sm" onchange="aplicarFiltros()">
            <option value="todos">Todos</option>
            <option value="has">Hipertensos</option>
            <option value="dia">Diabéticos</option>
            <option value="gestante">Gestantes</option>
            <option value="risco3">Risco 3</option>
            <option value="crianca">Crianças 0-2</option>
          </select>
        </div>
        <div class="col-12 col-md-2 d-grid">
          <button class="btn btn-secondary btn-sm" onclick="toggleView()">Alternar Vista</button>
        </div>
      </div>
    </div>
    <div id="view-cards" style="display:block;"></div>
    <div id="view-table" style="display:none;">
      <table class="table table-sm">
        <thead>
          <tr>
            <th class="text-center">Família</th>
            <th>Paciente</th>
            <th class="text-center">VD</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
  <!-- Modal Editar Paciente -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fas fa-user-edit"></i> Editar Paciente</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formEditar">
            <input type="hidden" id="edit-linha">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Nome</label>
                <input type="text" id="edit-nome" class="form-control form-control-sm">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Código MV</label>
                <input type="text" id="edit-mv" class="form-control form-control-sm">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Risco</label>
                <select id="edit-risco" class="form-select form-select-sm">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold">Família</label>
                <input type="text" id="edit-familia" class="form-control form-control-sm">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Tipo</label>
                <select id="edit-tipo" class="form-select form-select-sm">
                  <option value="CASA">CASA</option>
                  <option value="CASA VAZIA">CASA VAZIA</option>
                  <option value="RECUSA">RECUSA</option>
                </select>
              </div>
              <div class="col-md-5">
                <label class="form-label small fw-bold">Endereço</label>
                <input type="text" id="edit-endereco" class="form-control form-control-sm">
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold">Nº</label>
                <input type="text" id="edit-numero" class="form-control form-control-sm">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Telefone</label>
                <input type="text" id="edit-telefone" class="form-control form-control-sm">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">CNS</label>
                <input type="text" id="edit-cns" class="form-control form-control-sm">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Data Nasc.</label>
                <input type="text" id="edit-dn" class="form-control form-control-sm" placeholder="dd/mm/aaaa">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Sexo</label>
                <select id="edit-sexo" class="form-select form-select-sm">
                  <option value="FEMININO">FEMININO</option>
                  <option value="MASCULINO">MASCULINO</option>
                </select>
              </div>
            </div>
            <hr>
            <label class="fw-bold mb-2">Condições de Saúde</label>
            <div class="row">
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-has" class="form-check-input"><label class="form-check-label">HAS</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-dia1" class="form-check-input"><label class="form-check-label">DIA I</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-dia2" class="form-check-input"><label class="form-check-label">DIA II</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-insulino" class="form-check-input"><label class="form-check-label">INSULINO</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-gestante" class="form-check-input"><label class="form-check-label">GESTANTE</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-acamado" class="form-check-input"><label class="form-check-label">ACAMADO</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-domiciliado" class="form-check-input"><label class="form-check-label">DOMICILIADO</label></div>
              </div>
              <div class="col-6 col-md-3">
                <div class="form-check"><input type="checkbox" id="edit-bf" class="form-check-input"><label class="form-check-label">BOLSA FAM.</label></div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" onclick="salvarEdicao()">Salvar Alterações</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal Observação -->
  <div class="modal fade" id="modalObs" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title"><i class="fas fa-sticky-note"></i> Observação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="obs-linha">
          <div class="mb-3">
            <textarea id="obs-texto" class="form-control" rows="4"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="salvarObs()">Salvar</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal Cadastro -->
  <div class="modal fade" id="modalCadastro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="fas fa-user-plus"></i> Novo Cadastro</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="max-height:70vh;overflow-y:auto;">
          <form id="formCadastro">
            <div class="row g-2">
              <div class="col-12"><label class="small fw-bold">NOME</label><input type="text" name="nome" class="form-control form-control-sm"></div>
              <div class="col-6"><label class="small fw-bold">CÓDIGO MV</label><input type="text" name="mv" class="form-control form-control-sm"></div>
              <div class="col-6"><label class="small fw-bold">RISCO FAMILIAR</label><select name="risco" class="form-select form-select-sm"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
              <div class="col-12"><label class="small fw-bold">FAMÍLIA</label><input type="text" name="familia" class="form-control form-control-sm"></div>
              <div class="col-6"><label class="small fw-bold">TIPO</label><select name="tipo" class="form-select form-select-sm"><option value="CASA">CASA</option><option value="CASA VAZIA">CASA VAZIA</option><option value="RECUSA">RECUSA</option></select></div>
              <div class="col-6"><label class="small fw-bold">TELEFONE</label><input type="text" name="telefone" class="form-control form-control-sm"></div>
              <div class="col-12"><label class="small fw-bold">ENDEREÇO</label><input type="text" name="endereco" class="form-control form-control-sm"></div>
              <div class="col-4"><label class="small fw-bold">Nº</label><input type="text" name="numero" class="form-control form-control-sm"></div>
              <div class="col-4"><label class="small fw-bold">CNS</label><input type="text" name="cns" class="form-control form-control-sm"></div>
              <div class="col-4"><label class="small fw-bold">DATA NASC.</label><input type="text" name="dn" class="form-control form-control-sm" placeholder="dd/mm/aaaa"></div>
              <div class="col-4"><label class="small fw-bold">SEXO</label><select name="sexo" class="form-select form-select-sm"><option value="FEMININO">FEMININO</option><option value="MASCULINO">MASCULINO</option></select></div>
            </div>
            <hr>
            <label class="fw-bold mb-2">Condições de Saúde</label>
            <div class="row">
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="has" class="form-check-input"><label class="form-check-label">HAS</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="dia1" class="form-check-input"><label class="form-check-label">DIA I</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="dia2" class="form-check-input"><label class="form-check-label">DIA II</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="insulino" class="form-check-input"><label class="form-check-label">INSULINO</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="gestante" class="form-check-input"><label class="form-check-label">GESTANTE</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="acamado" class="form-check-input"><label class="form-check-label">ACAMADO</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="domiciliado" class="form-check-input"><label class="form-check-label">DOMICILIADO</label></div></div>
              <div class="col-6 col-md-3"><div class="form-check"><input type="checkbox" name="bf" class="form-check-input"><label class="form-check-label">BOLSA FAM.</label></div></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" onclick="salvarNovoPaciente()">Salvar Paciente</button>
        </div>
      </div>
    </div>
  </div>
  <button onclick="abrirModalCadastro()" style="position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background-color:#0056b3;color:white;border:none;box-shadow:0 4px 8px rgba(0,0,0,0.3);z-index:1000;font-size:24px;">
    <i class="fas fa-plus"></i>
  </button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
