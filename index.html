<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USF Vila Dutra - Gestão Mobile</title>
  <!-- Bootstrap 5 CDN para responsividade mobile -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar { background-color: #0056b3; }
    .kpi-card { border-radius: 10px; color: white; padding: 15px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .bg-has { background-color: #dc3545; }
    .bg-dia { background-color: #fd7e14; }
    .bg-gestante { background-color: #e83e8c; }
    .bg-geral { background-color: #17a2b8; }
    .patient-card { border-left: 5px solid #0056b3; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .badge-condicao { font-size: 0.75rem; margin-right: 5px; margin-bottom: 5px; }
    #loading { display: flex; justify-content: center; align-items: center; height: 50vh; }
    .action-btn { font-size: 1.2rem; cursor: pointer; color: #6c757d; margin-left: 10px; }
  </style>
</head>
<body>

  <!-- Cabecalho -->
  <nav class="navbar navbar-dark mb-3 sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1"><i class="fas fa-heartbeat"></i> USF Vila Dutra</span>
      <div>
        <button class="btn btn-outline-light btn-sm" onclick="toggleView()"><i class="fas fa-exchange-alt"></i> Alternar Visão</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    
    <!-- Dashboard -->
    <div class="row text-center mb-3">
      <div class="col-6 col-md-3">
        <div class="kpi-card bg-geral">
          <h3 id="kpi-pessoas">0</h3><small>Pessoas</small>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="kpi-card bg-geral">
          <h3 id="kpi-familias">0</h3><small>Famílias</small>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="kpi-card bg-has">
          <h4 id="kpi-has">0</h4><small>HAS</small>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="kpi-card bg-dia">
          <h4 id="kpi-dia">0</h4><small>Diabéticos</small>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="kpi-card bg-gestante">
          <h4 id="kpi-gestantes">0</h4><small>Gestantes</small>
        </div>
      </div>
    </div>

    <!-- Tela de Carregamento -->
    <div id="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <!-- Container Principal de Dados -->
    <div id="dados-container" style="display: none;">
      
      <!-- Visao de Cartoes (Mobile) -->
      <div id="view-cards"></div>

      <!-- Visao de Planilha (Tabela) -->
      <div id="view-table" class="table-responsive" style="display: none;">
        <table class="table table-striped table-bordered bg-white">
          <thead class="table-dark">
            <tr>
              <th>MV</th>
              <th>Família</th>
              <th>Nome</th>
              <th>Endereço</th>
              <th>Telefone</th>
              <th>Condições</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let dadosGlobais = [];
    let isCardView = true;

    // Inicia buscando os dados no Apps Script
    window.onload = function() {
      google.script.run.withSuccessHandler(processarDados).getDadosPlanilha();
    };

    function processarDados(dados) {
      dadosGlobais = dados;
      atualizarDashboard();
      renderizarCartoes();
      renderizarTabela();
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dados-container').style.display = 'block';
    }

    function atualizarDashboard() {
      document.getElementById('kpi-pessoas').innerText = dadosGlobais.length;
      
      // Conta famílias únicas
      const familias = new Set(dadosGlobais.map(d => d.familia).filter(f => f !== ""));
      document.getElementById('kpi-familias').innerText = familias.size;

      document.getElementById('kpi-has').innerText = dadosGlobais.filter(d => d.has).length;
      document.getElementById('kpi-dia').innerText = dadosGlobais.filter(d => d.dia1 || d.dia2).length;
      document.getElementById('kpi-gestantes').innerText = dadosGlobais.filter(d => d.gestante).length;
    }

    function renderizarCartoes() {
      const container = document.getElementById('view-cards');
      container.innerHTML = '';

      dadosGlobais.forEach(paciente => {
        let badges = '';
        if(paciente.has) badges += `<span class="badge bg-danger badge-condicao">HAS</span>`;
        if(paciente.dia1) badges += `<span class="badge bg-warning text-dark badge-condicao">DM1</span>`;
        if(paciente.dia2) badges += `<span class="badge bg-warning text-dark badge-condicao">DM2</span>`;
        if(paciente.gestante) badges += `<span class="badge bg-pink badge-condicao" style="background-color:#e83e8c;">GESTANTE</span>`;
        if(paciente.acamado) badges += `<span class="badge bg-secondary badge-condicao">ACAMADO</span>`;

        const card = `
          <div class="card patient-card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title mb-0">${paciente.nome}</h5>
                <div>
                  <i class="fas fa-edit action-btn text-primary" onclick="editar(${paciente.linha})"></i>
                  <i class="fas fa-trash action-btn text-danger" onclick="deletar(${paciente.linha})"></i>
                </div>
              </div>
              <h6 class="card-subtitle mb-2 text-muted">Família: ${paciente.familia} | Risco: ${paciente.risco}</h6>
              <p class="card-text mb-1"><i class="fas fa-map-marker-alt"></i> ${paciente.endereco}, ${paciente.numero}</p>
              <p class="card-text mb-2"><i class="fas fa-phone"></i> ${paciente.telefone}</p>
              <div>${badges}</div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function renderizarTabela() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      dadosGlobais.forEach(paciente => {
        let condicoes = [];
        if(paciente.has) condicoes.push("HAS");
        if(paciente.dia1 || paciente.dia2) condicoes.push("DIA");
        if(paciente.gestante) condicoes.push("GES");

        const tr = `
          <tr>
            <td>${paciente.mv}</td>
            <td>${paciente.familia}</td>
            <td>${paciente.nome}</td>
            <td>${paciente.endereco}, ${paciente.numero}</td>
            <td>${paciente.telefone}</td>
            <td>${condicoes.join(', ')}</td>
            <td>
              <i class="fas fa-edit text-primary" style="cursor:pointer" onclick="editar(${paciente.linha})"></i>
              <i class="fas fa-trash text-danger ms-2" style="cursor:pointer" onclick="deletar(${paciente.linha})"></i>
            </td>
          </tr>
        `;
        tbody.innerHTML += tr;
      });
    }

    function toggleView() {
      isCardView = !isCardView;
      document.getElementById('view-cards').style.display = isCardView ? 'block' : 'none';
      document.getElementById('view-table').style.display = isCardView ? 'none' : 'block';
    }

    function deletar(linha) {
      if(confirm('Tem certeza que deseja remover este paciente? Esta ação altera a planilha real.')) {
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('dados-container').style.display = 'none';
        
        google.script.run.withSuccessHandler(() => {
          alert('Removido com sucesso!');
          google.script.run.withSuccessHandler(processarDados).getDadosPlanilha();
        }).deletarRegistro(linha);
      }
    }

    function editar(linha) {
      alert("A função de edição de formulário será aberta aqui. Linha da planilha: " + linha);
      // Aqui pode ser implementado um modal do Bootstrap para enviar um objeto atualizado via POST
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
